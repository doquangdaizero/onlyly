<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💫 Tìm em...</title>
  
  <!-- CHÈN THÊM IMPORTMAP CHO THREE.JS VÀO ĐÂY -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    /* ===== RESET & BODY ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(145deg, #fef6f0 0%, #fde8e0 30%, #fcd5d0 60%, #fcc8c4 100%);
      overflow: hidden;
      position: relative;
    }

    /* ===== BỐ CỤC CHIA ĐÔI MÀN HÌNH ===== */
    .split-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
      z-index: 1; /* Nằm trên các hiệu ứng background */
    }

    .left-pane {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Nếu trên điện thoại, đưa lên trên */
    }

    .right-pane {
      flex: 1;
      position: relative;
      /* Container chứa bó hoa 3D */
    }

    /* ===== BACKGROUND DECORATION ===== */
    .bg-deco {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .deco-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
    }
    .deco-blob:nth-child(1) {
      width: 500px; height: 500px; top: -200px; right: -150px;
      background: #f5a0a0; opacity: 0.12;
    }
    .deco-blob:nth-child(2) {
      width: 400px; height: 400px; bottom: -150px; left: -120px;
      background: #f5b8b0; opacity: 0.10;
    }
    .deco-blob:nth-child(3) {
      width: 250px; height: 250px; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #f5c0b8; opacity: 0.06;
    }

    /* ===== FLOATING PARTICLES (UI) ===== */
    .floating-particles {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .f-particle {
      position: absolute; border-radius: 50%; background: #f5a0a0;
      animation: fParticleFloat linear infinite; opacity: 0.08;
    }
    @keyframes fParticleFloat {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ===== CONTAINER (BẢNG UI CỦA BẠN) ===== */
    .container {
      position: relative;
      z-index: 1;
      max-width: 420px;
      width: 90%;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(30px);
      border-radius: 32px;
      padding: 44px 32px 36px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 20px 60px rgba(245, 160, 160, 0.08),
        0 8px 30px rgba(0, 0, 0, 0.02),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      text-align: center;
      opacity: 0;
      transform: translateY(24px) scale(0.97);
      animation: containerIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: 0.2s;
    }
    @keyframes containerIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Giữ nguyên toàn bộ CSS cũ của bạn cho phần UI */
    .icon-wrap { font-size: 56px; margin-bottom: 12px; display: inline-block; animation: iconFloat 3s ease-in-out infinite; }
    @keyframes iconFloat { 0%, 100% { transform: translateY(0) scale(1) rotate(0deg); } 50% { transform: translateY(-8px) scale(1.05) rotate(-3deg); } }
    .title { font-size: 24px; font-weight: 600; color: #3d2a1e; margin-bottom: 4px; letter-spacing: -0.3px; }
    .title .hl { background: linear-gradient(135deg, #e8867a, #d4738a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700; }
    .sub { color: rgba(61, 42, 30, 0.4); font-size: 14px; font-weight: 300; margin-bottom: 28px; }
    .sub .hl { color: #e8867a; font-weight: 400; }
    .spinner-wrap { display: flex; justify-content: center; margin: 8px 0 20px; }
    .spinner { position: relative; width: 120px; height: 120px; }
    .spinner svg { width: 120px; height: 120px; transform: rotate(-90deg); }
    .spinner .bg-circle { fill: none; stroke: rgba(232, 134, 122, 0.08); stroke-width: 3; }
    .spinner .progress-circle { fill: none; stroke: url(#grad); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 339.292; stroke-dashoffset: 339.292; transition: stroke-dashoffset 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .spinner .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .spinner .pct { font-size: 28px; font-weight: 600; color: #3d2a1e; font-family: 'Courier New', monospace; transition: all 0.5s ease; }
    .spinner .pct.done { color: #e8867a; }
    .spinner .label { font-size: 10px; color: rgba(61, 42, 30, 0.2); text-transform: uppercase; letter-spacing: 3px; margin-top: 2px; transition: all 0.5s ease; }
    .spinner .label.done { color: #e8867a; }
    .status-bar { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 18px; background: rgba(255, 255, 255, 0.4); border-radius: 30px; border: 1px solid rgba(232, 134, 122, 0.06); margin: 8px 0 16px; min-height: 44px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(61, 42, 30, 0.05); transition: all 0.5s ease; flex-shrink: 0; }
    .status-dot.active { background: #e8867a; box-shadow: 0 0 25px rgba(232, 134, 122, 0.2); animation: dotPulse 1.2s ease-in-out infinite; }
    .status-dot.done { background: #d4738a; box-shadow: 0 0 30px rgba(212, 115, 138, 0.15); animation: none; }
    @keyframes dotPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }
    .status-text { color: rgba(61, 42, 30, 0.4); font-size: 13px; font-weight: 300; letter-spacing: 0.3px; transition: all 0.5s ease; }
    .status-text .hl { color: #e8867a; font-weight: 400; }
    .status-text .done { color: #d4738a; font-weight: 500; }
    .log-wrap { text-align: left; padding: 12px 16px; background: rgba(255, 255, 255, 0.3); border-radius: 16px; border: 1px solid rgba(232, 134, 122, 0.04); min-height: 70px; max-height: 120px; overflow-y: auto; margin: 4px 0 16px; }
    .log-wrap::-webkit-scrollbar { width: 3px; }
    .log-wrap::-webkit-scrollbar-thumb { background: rgba(232, 134, 122, 0.15); border-radius: 10px; }
    .log { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 13px; color: rgba(61, 42, 30, 0.2); opacity: 0; transform: translateX(-6px); animation: logIn 0.35s ease forwards; }
    .log .icon { font-size: 16px; }
    .log .text { color: rgba(61, 42, 30, 0.5); }
    .log .hl { color: #e8867a; font-weight: 500; }
    .log .ok { color: #d4738a; font-weight: 500; }
    .log .love { color: #e8867a; }
    @keyframes logIn { to { opacity: 1; transform: translateX(0); } }
    .countdown-wrap { margin-top: 8px; opacity: 0; transition: opacity 0.6s ease; }
    .countdown-wrap.show { opacity: 1; }
    .countdown-track { width: 100%; height: 2px; background: rgba(61, 42, 30, 0.04); border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
    .countdown-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #e8867a, #d4738a); border-radius: 10px; animation: countdownShrink 3s linear forwards; }
    @keyframes countdownShrink { 0% { width: 100%; } 100% { width: 0%; } }
    .countdown-text { color: rgba(61, 42, 30, 0.12); font-size: 12px; font-weight: 300; letter-spacing: 1px; }
    .countdown-text .num { color: #e8867a; font-weight: 500; }
    .popup { position: fixed; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); border: 1px solid rgba(232, 134, 122, 0.08); border-radius: 14px; padding: 10px 18px; font-family: 'Segoe UI', sans-serif; font-size: 13px; color: #3d2a1e; box-shadow: 0 16px 48px rgba(232, 134, 122, 0.06); z-index: 1001; pointer-events: none; animation: popupIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; animation-delay: var(--delay, 0s); opacity: 0; transform: scale(0.9) translateY(8px); display: flex; align-items: center; gap: 10px; max-width: 90%; }
    .popup .icon { font-size: 16px; }
    .popup .text { color: rgba(61, 42, 30, 0.6); font-size: 12px; }
    .popup .badge { background: rgba(232, 134, 122, 0.06); padding: 1px 10px; border-radius: 20px; font-size: 9px; color: #e8867a; border: 1px solid rgba(232, 134, 122, 0.06); text-transform: uppercase; letter-spacing: 0.5px; }
    @keyframes popupIn { 0% { opacity: 0; transform: scale(0.9) translateY(8px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    .popup.fade { animation: popupOut 0.35s ease forwards; animation-delay: var(--delay, 2s); }
    @keyframes popupOut { 0% { opacity: 1; transform: scale(1) translateY(0); } 100% { opacity: 0; transform: scale(0.9) translateY(-12px); } }

    /* Đáp ứng thiết bị di động (Responsive) */
    @media (max-width: 768px) {
      .split-layout { flex-direction: column; }
      .left-pane, .right-pane { height: 50vh; width: 100vw; }
      .container { padding: 20px 18px; margin-top: 20px; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg-deco">
    <div class="deco-blob"></div>
    <div class="deco-blob"></div>
    <div class="deco-blob"></div>
  </div>
  <div class="floating-particles" id="floatingParticles"></div>

  <!-- KẾT HỢP HAI BÊN TẠI ĐÂY -->
  <div class="split-layout">
    
    <!-- BÊN TRÁI: KHUNG TÌM EM -->
    <div class="left-pane">
      <div class="container" id="container">
        <!-- Icon -->
        <div class="icon-wrap" id="iconWrap">💫</div>

        <!-- Title -->
        <div class="title" id="title">
          Tìm <span class="hl">em</span> giữa hàng tỉ người...
        </div>
        <div class="sub" id="sub">
          Biết đâu <span class="hl">em</span> ở đâu đó...
        </div>

        <!-- Spinner -->
        <div class="spinner-wrap">
          <div class="spinner">
            <svg viewBox="0 0 120 120">
              <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#e8867a"/>
                  <stop offset="50%" style="stop-color:#e8867a"/>
                  <stop offset="100%" style="stop-color:#d4738a"/>
                </linearGradient>
              </defs>
              <circle class="bg-circle" cx="60" cy="60" r="54"/>
              <circle class="progress-circle" id="progressCircle" cx="60" cy="60" r="54"/>
            </svg>
            <div class="center">
              <div class="pct" id="pct">0%</div>
              <div class="label" id="label">TÌM EM</div>
            </div>
          </div>
        </div>

        <!-- Status -->
        <div class="status-bar">
          <span class="status-dot active" id="statusDot"></span>
          <span class="status-text" id="statusText">
            <span class="hl">●</span> Đang tìm em...
          </span>
        </div>

        <!-- Log -->
        <div class="log-wrap" id="logWrap">
          <div class="log">
            <span class="icon">💫</span>
            <span class="text">Bắt đầu tìm em...</span>
          </div>
        </div>

        <!-- Countdown -->
        <div class="countdown-wrap" id="countdownWrap">
          <div class="countdown-track">
            <div class="countdown-fill" id="countdownFill"></div>
          </div>
          <div class="countdown-text">
            Gặp em sau <span class="num" id="countNum">3</span>s
          </div>
        </div>
      </div>
    </div>

    <!-- BÊN PHẢI: BÓ HOA 3D -->
    <div class="right-pane" id="flower-container">
       <!-- File main.js sẽ vẽ bó hoa vào khoảng trống này -->
    </div>

  </div>

  <!-- SCRIPTS GIAO DIỆN -->
  <script>
    // TOÀN BỘ SCRIPT JS CỦA BẠN GIỮ NGUYÊN HOÀN TOÀN TẠI ĐÂY
    (function createParticles() {
      const container = document.getElementById('floatingParticles');
      for (let i = 0; i < 30; i++) {
        const el = document.createElement('div');
        el.className = 'f-particle';
        el.style.left = Math.random() * 100 + '%';
        el.style.animationDuration = 12 + Math.random() * 18 + 's';
        el.style.animationDelay = Math.random() * 12 + 's';
        el.style.width = (3 + Math.random() * 6) + 'px';
        el.style.height = el.style.width;
        el.style.opacity = 0.06 + Math.random() * 0.10;
        el.style.background = Math.random() > 0.5 ? '#e8867a' : '#d4738a';
        container.appendChild(el);
      }
    })();

    const popupMessages = [
      { icon: '💫', text: 'Đang tìm em giữa hàng tỉ người...', badge: 'TÌM' },
      { icon: '🌙', text: 'Phát hiện một ánh sáng đặc biệt!', badge: 'FOUND' },
      { icon: '☁️', text: 'Em ở đâu nhỉ...?', badge: 'TÌM' },
      { icon: '🌅', text: 'Đang tiến gần hơn...', badge: 'GẦN' },
      { icon: '✨', text: 'Kết nối đang được thiết lập...', badge: 'SYNC' },
      { icon: '🌤', text: 'Hình như là em rồi!', badge: 'GẦN' },
      { icon: '☀️', text: 'Gặp được em thật tuyệt!', badge: 'YES' },
      { icon: '⭐', text: 'Em tỏa sáng quá!', badge: 'WOW' },
      { icon: '🌙', text: 'Cuối cùng cũng tìm thấy...', badge: 'THẤY' },
      { icon: '💫', text: 'Chính là em!', badge: 'ĐÂY RỒI' }
    ];

    function showPopup(msg, delay = 0) {
      const el = document.createElement('div');
      el.className = 'popup';
      el.style.setProperty('--delay', delay + 's');
      el.innerHTML = `
        <span class="icon">${msg.icon}</span>
        <span class="text">${msg.text}</span>
        <span class="badge">${msg.badge}</span>
      `;
      // Giới hạn popup chỉ hiện ở nửa trái màn hình để không che mất bó hoa
      const x = 10 + Math.random() * (window.innerWidth * 0.4); 
      const y = 10 + Math.random() * (window.innerHeight * 0.65);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);

      const duration = 1.8 + Math.random() * 2.2;
      setTimeout(() => {
        el.classList.add('fade');
        el.style.setProperty('--delay', duration + 's');
        setTimeout(() => {
          if (el.parentNode) el.remove();
        }, duration * 1000 + 400);
      }, duration * 1000);
    }

    const CIRCUMFERENCE = 339.292;
    const progressCircle = document.getElementById('progressCircle');
    const pct = document.getElementById('pct');
    const label = document.getElementById('label');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const logWrap = document.getElementById('logWrap');
    const countdownWrap = document.getElementById('countdownWrap');
    const countNum = document.getElementById('countNum');
    const iconWrap = document.getElementById('iconWrap');
    const title = document.getElementById('title');
    const sub = document.getElementById('sub');

    function addLog(icon, text, delay = 0) {
      return new Promise(resolve => {
        setTimeout(() => {
          const div = document.createElement('div');
          div.className = 'log';
          div.innerHTML = `<span class="icon">${icon}</span><span class="text">${text}</span>`;
          logWrap.appendChild(div);
          logWrap.scrollTop = logWrap.scrollHeight;
          resolve();
        }, delay);
      });
    }

    function setProgress(pctVal, labelText) {
      const offset = CIRCUMFERENCE - (pctVal / 100) * CIRCUMFERENCE;
      progressCircle.style.strokeDashoffset = offset;
      pct.textContent = Math.round(pctVal) + '%';
      label.textContent = labelText;
    }

    function setStatus(text, type = 'normal') {
      if (type === 'done') {
        statusDot.className = 'status-dot done';
        statusText.innerHTML = `<span class="done">●</span> <span class="done">${text}</span>`;
      } else {
        statusDot.className = 'status-dot active';
        statusText.innerHTML = `<span class="hl">●</span> ${text}`;
      }
    }

    function redirectToSurvey() {
      // Nếu bạn không muốn nó tự động chuyển trang sau khi đếm ngược xong,
      // hãy xóa nội dung trong hàm này hoặc thêm dấu // đằng trước:
      // window.location.href = 'survey.html?hacked=true&timestamp=' + Date.now();
    }

    async function startSequence() {
      let popupInterval = setInterval(() => {
        const msg = popupMessages[Math.floor(Math.random() * popupMessages.length)];
        showPopup(msg);
      }, 1200);

      setStatus('Đang tìm em...');
      await addLog('💫', 'Bắt đầu tìm em...', 300);
      
      for (let p = 3; p <= 25; p += 2) {
        setProgress(p, 'TÌM EM');
        await new Promise(r => setTimeout(r, 120));
      }
      await addLog('🌙', 'Biết đâu em ở đâu đó...', 400);
      await addLog('☁️', 'Đang tìm em giữa hàng tỉ người...', 500);

      setStatus('Phát hiện <span class="hl">ánh sáng</span> đặc biệt...');
      for (let p = 28; p <= 52; p += 2) {
        setProgress(p, 'PHÁT HIỆN');
        await new Promise(r => setTimeout(r, 100));
      }
      await addLog('🌅', 'Phát hiện <span class="hl">ánh sáng</span> đặc biệt!', 400);
      await addLog('✨', 'Kết nối đang <span class="hl">thiết lập</span>...', 500);

      setStatus('Đang tiến gần <span class="hl">em</span> hơn...');
      for (let p = 55; p <= 80; p += 2) {
        setProgress(p, 'TIẾN GẦN');
        await new Promise(r => setTimeout(r, 90));
      }
      await addLog('🌤', 'Hình như <span class="love">em</span> ở đây rồi...', 400);
      await addLog('☀️', 'Đang đến gần <span class="love">em</span>...', 500);

      setStatus('Đang đến gần <span class="hl">em</span>...');
      for (let p = 83; p <= 100; p += 1.5) {
        setProgress(p, 'GẦN RỒI');
        await new Promise(r => setTimeout(r, 80));
      }
      await addLog('⭐', '<span class="ok">✓ Tìm thấy em rồi!</span>', 400);
      await addLog('🌙', 'Chính là <span class="love">em</span>!', 500);

      clearInterval(popupInterval);

      iconWrap.textContent = '☀️';
      title.innerHTML = 'Tìm thấy <span class="hl">em</span> rồi!';
      sub.innerHTML = 'Thì ra <span class="hl">em</span> ở đây... 💫';
      pct.classList.add('done');
      label.classList.add('done');
      setStatus('✦ TÌM THẤY EM ✦', 'done');

      setTimeout(() => {
        for (let i = 0; i < 3; i++) {
          setTimeout(() => {
            const msg = popupMessages[Math.floor(Math.random() * popupMessages.length)];
            showPopup(msg);
          }, i * 400);
        }
      }, 300);

      countdownWrap.classList.add('show');
      let count = 3;
      countNum.textContent = count;

      const countInterval = setInterval(() => {
        count--;
        if (count > 0) {
          countNum.textContent = count;
          countNum.style.opacity = '0.3';
          setTimeout(() => { countNum.style.opacity = '1'; }, 200);
        } else {
          clearInterval(countInterval);
          redirectToSurvey();
        }
      }, 1000);
    }

    setTimeout(startSequence, 400);
  </script>

  <!-- GỌI SCRIPT HOA 3D -->
  <script type="module" src="main.js"></script>

</body>
</html>
