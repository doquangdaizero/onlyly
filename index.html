<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💫 Gửi em...</title>
    
    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        /* ===== NỀN SAO ===== */
        .stars-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #000;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            opacity: var(--opacity);
        }
        @keyframes twinkle {
            0% { opacity: var(--opacity-min); transform: scale(0.8); }
            100% { opacity: var(--opacity-max); transform: scale(1.2); }
        }

        /* ===== LAYOUT ===== */
        .app-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 1;
            gap: 0;
            overflow: hidden;
        }

        /* ===== LEFT PANEL ===== */
        .left-panel {
            flex: 0 0 45%;
            min-width: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            position: relative;
            z-index: 2;
        }

        .container {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 40px 32px 36px;
            border: 1px solid rgba(255, 200, 210, 0.3);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 8px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.97);
            animation: containerIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 0.2s;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 350px;
        }
        .container::-webkit-scrollbar { width: 3px; }
        .container::-webkit-scrollbar-thumb { background: rgba(200, 150, 160, 0.3); border-radius: 10px; }

        @keyframes containerIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== RIGHT PANEL - 3D ===== */
        .right-panel {
            flex: 1;
            position: relative;
            z-index: 1;
            background: transparent;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .right-panel canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== TYPOGRAPHY ===== */
        .icon-wrap {
            font-size: 52px;
            margin-bottom: 12px;
            display: inline-block;
            filter: drop-shadow(0 0 30px rgba(255, 150, 180, 0.2));
            animation: iconPulse 3s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .greeting {
            font-size: 19px;
            font-weight: 300;
            color: rgba(80, 50, 60, 0.6);
            margin-bottom: 16px;
            letter-spacing: 1.5px;
        }
        .greeting .hl {
            color: #e8867a;
            font-weight: 400;
        }

        /* ===== TYPEWRITER ===== */
        .typewriter-wrap {
            width: 100%;
            min-height: 180px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            margin: 4px 0 20px;
            padding: 0 4px;
        }
        .typewriter-text {
            font-size: 16px;
            line-height: 2.2;
            color: #2d1a22;
            font-weight: 300;
            text-align: left;
            width: 100%;
            min-height: 120px;
            letter-spacing: 0.3px;
        }
        .typewriter-text .line {
            opacity: 0;
            animation: fadeInLine 0.4s ease forwards;
        }
        .typewriter-text .line.done {
            opacity: 1;
        }
        .typewriter-text .highlight {
            color: #e8867a;
            font-weight: 400;
        }
        .typewriter-text .highlight-pink {
            color: #d4738a;
            font-weight: 400;
        }
        .typewriter-text .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #e8867a;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        @keyframes fadeInLine {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== BUTTON ===== */
        .btn-wrap {
            margin-top: 8px;
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .btn-wrap.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .btn-action {
            padding: 14px 44px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #e8867a, #d4738a);
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 30px rgba(232, 134, 122, 0.3);
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(232, 134, 122, 0.4);
        }
        .btn-action:active {
            transform: scale(0.96);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .app-wrapper { flex-direction: column; }
            .left-panel {
                flex: 0 0 auto;
                min-width: unset;
                padding: 12px 16px;
                height: auto;
                max-height: 50vh;
                overflow-y: auto;
            }
            .container {
                padding: 24px 20px 20px;
                background: rgba(255, 255, 255, 0.95);
                border-radius: 20px;
                min-height: 280px;
            }
            .right-panel {
                flex: 1;
                min-height: 50vh;
                height: 50vh;
            }
            .greeting { font-size: 16px; }
            .typewriter-text { font-size: 14px; line-height: 2; }
            .icon-wrap { font-size: 40px; }
            .btn-action { padding: 11px 30px; font-size: 14px; }
        }

        @media (max-width: 480px) {
            .left-panel { padding: 8px 10px; max-height: 45vh; }
            .container { padding: 18px 14px 16px; border-radius: 16px; min-height: 220px; }
            .greeting { font-size: 14px; margin-bottom: 10px; }
            .typewriter-text { font-size: 13px; line-height: 1.9; min-height: 80px; }
            .typewriter-wrap { min-height: 130px; }
            .icon-wrap { font-size: 32px; margin-bottom: 8px; }
            .btn-action { padding: 9px 22px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- NỀN SAO -->
    <div class="stars-bg" id="starsBg"></div>

    <!-- ===== APP WRAPPER ===== -->
    <div class="app-wrapper">

        <!-- ===== LEFT PANEL ===== -->
        <div class="left-panel">
            <div class="container" id="container">
                <!-- Icon -->
                <div class="icon-wrap" id="iconWrap">🌹</div>

                <!-- Greeting -->
                <div class="greeting" id="greeting">
                    Gửi <span class="hl">em</span> yêu,
                </div>

                <!-- Typewriter -->
                <div class="typewriter-wrap">
                    <div class="typewriter-text" id="typewriterText"></div>
                </div>

                <!-- Button -->
                <div class="btn-wrap" id="btnWrap">
                    <button class="btn-action" id="btnAction">
                        Đồng ý nghe anh nhé
                    </button>
                </div>
            </div>
        </div>

        <!-- ===== RIGHT PANEL - 3D ===== -->
        <div class="right-panel" id="threeContainer"></div>
    </div>

    <!-- ============================================================= -->
    <!-- THREE.JS -->
    <!-- ============================================================= -->
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

        const container = document.getElementById('threeContainer');
        const scene = new THREE.Scene();
        scene.add(new THREE.HemisphereLight(0xffe8e2, 0x26302a, 1.5));
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
        keyLight.position.set(2, 4, 5);
        scene.add(keyLight);
        
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.5;

        const loader = new GLTFLoader();
        const PARTICLE_COUNT = 400000;
        let particleSystem;
        let detailModel;

        const MODEL_URL = 'flower-bouquet/source/flower_bouquet.glb';

        loader.load(MODEL_URL, (gltf) => {
            const vertices = [];
            const colors = [];
            const phases = [];
            const meshes = [];

            gltf.scene.traverse((child) => {
                if (child.isMesh) meshes.push(child);
            });
            gltf.scene.updateMatrixWorld(true);

            const tempPosition = new THREE.Vector3();
            const innerPosition = new THREE.Vector3();
            const bounds = new THREE.Box3();
            meshes.forEach((mesh) => bounds.union(new THREE.Box3().setFromObject(mesh)));
            const modelCenter = bounds.getCenter(new THREE.Vector3());
            const modelSize = bounds.getSize(new THREE.Vector3());
            const meshWeights = meshes.map((mesh) => {
                const isStem = /stem/i.test(mesh.name);
                const isGreen = /leav|plant|green|foliage/i.test(mesh.name);
                const isRibbon = /ribbon/i.test(mesh.name);
                return isStem ? 0.4 : (isGreen ? 0.28 : (isRibbon ? 0.7 : 2.1));
            });
            const totalWeight = meshWeights.reduce((sum, weight) => sum + weight, 0);

            meshes.forEach((mesh, meshIndex) => {
                const sampler = new MeshSurfaceSampler(mesh).build();
                const isStem = /stem/i.test(mesh.name);
                const isGreen = /leav|plant|green|foliage/i.test(mesh.name);
                const isRibbon = /ribbon/i.test(mesh.name);
                const isPetal = /^petal/i.test(mesh.name);
                const flowerMeshPalette = [0xfffaf5, 0xe9a5ad, 0xffffff, 0xf1b3b5, 0xffe7dd, 0xd9828c];
                const greenPalette = [0xb7c1ad, 0x9cae9d, 0xd0d0bf, 0x829486, 0xc3c8b9];
                const stemPalette = [0x9f5b5d, 0xb87373, 0x7f4b50, 0xc48782];
                const ribbonPalette = [0xffffff, 0xfffaf4, 0xf5eee5, 0xe9e1d8];
                const pointsPerMesh = Math.max(60, Math.floor(PARTICLE_COUNT * meshWeights[meshIndex] / totalWeight));
                const meshBounds = new THREE.Box3().setFromObject(mesh);
                const meshCenter = meshBounds.getCenter(new THREE.Vector3());
                const meshExtent = meshBounds.getSize(new THREE.Vector3());

                for (let i = 0; i < pointsPerMesh; i++) {
                    sampler.sample(tempPosition);
                    tempPosition.applyMatrix4(mesh.matrixWorld);

                    vertices.push(tempPosition.x, tempPosition.y, tempPosition.z);

                    const localX = (tempPosition.x - meshCenter.x) / Math.max(meshExtent.x, 0.001);
                    const localY = (tempPosition.y - meshCenter.y) / Math.max(meshExtent.y, 0.001);
                    const localZ = (tempPosition.z - meshCenter.z) / Math.max(meshExtent.z, 0.001);
                    const petalRadius = Math.sqrt(localX * localX + localY * localY + localZ * localZ);
                    const petalAngle = Math.atan2(localY, localX);
                    const petalLayer = Math.sin(petalRadius * 18.0 + petalAngle * 2.5 + localZ * 5.0);
                    const flowerBase = new THREE.Color(flowerMeshPalette[meshIndex % flowerMeshPalette.length]);
                    const petalWhite = new THREE.Color(0xfffaf5);
                    const flowerHighlight = isPetal && petalLayer > 0.05;
                    const particleColor = flowerHighlight
                        ? petalWhite.lerp(flowerBase, Math.random() * 0.28)
                        : flowerBase.clone().lerp(new THREE.Color(0xffffff), Math.random() * 0.08);
                    const palette = isRibbon ? ribbonPalette : (isStem ? stemPalette : greenPalette);
                    const finalColor = isRibbon || isStem || isGreen
                        ? new THREE.Color(palette[Math.floor(Math.random() * palette.length)])
                        : particleColor;
                    colors.push(finalColor.r, finalColor.g, finalColor.b);
                    phases.push(Math.random() * Math.PI * 2);

                    if (isPetal) {
                        innerPosition.copy(tempPosition).lerp(modelCenter, 0.1);
                        vertices.push(innerPosition.x, innerPosition.y, innerPosition.z);
                        colors.push(finalColor.r, finalColor.g, finalColor.b);
                        phases.push(Math.random() * Math.PI * 2);
                    } else {
                        innerPosition.copy(tempPosition).lerp(modelCenter, 0.16);
                        vertices.push(innerPosition.x, innerPosition.y, innerPosition.z);
                        colors.push(finalColor.r, finalColor.g, finalColor.b);
                        phases.push(Math.random() * Math.PI * 2);
                        innerPosition.copy(tempPosition).lerp(modelCenter, 0.34);
                        vertices.push(innerPosition.x, innerPosition.y, innerPosition.z);
                        colors.push(finalColor.r, finalColor.g, finalColor.b);
                        phases.push(Math.random() * Math.PI * 2);
                    }
                }
            });

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('phase', new THREE.Float32BufferAttribute(phases, 1));
            const largestDimension = Math.max(modelSize.x, modelSize.y, modelSize.z);
            geometry.translate(-modelCenter.x, -modelCenter.y, -modelCenter.z);

            detailModel = gltf.scene;
            detailModel.position.copy(modelCenter).multiplyScalar(-1);
            detailModel.traverse((child) => {
                if (!child.isMesh) return;
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                child.material = materials.map((sourceMaterial) => {
                    const material = sourceMaterial.clone();
                    material.transparent = true;
                    material.opacity = 0.85;
                    material.depthWrite = false;
                    return material;
                });
            });
            scene.add(detailModel);

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    pointSize: { value: Math.max(largestDimension * 0.0045, 0.0015) },
                    flowStrength: { value: Math.max(largestDimension * 0.02, 0.001) }
                },
                vertexShader: `
                    uniform float time;
                    uniform float pointSize;
                    uniform float flowStrength;
                    attribute float phase;
                    varying vec3 vColor;
                    void main() {
                        vec3 animatedPosition = position;
                        float heatWave = time * 1.45 + phase + position.y * 8.0;
                        float risingHeat = sin(heatWave) * 0.6 + cos(time * 0.72 + phase * 1.6) * 0.4;
                        vec3 radialDirection = normalize(position + vec3(0.0, 0.12, 0.0));
                        float solarPulse = max(0.0, sin(time * 1.8 + phase * 1.3 + position.y * 6.0));
                        animatedPosition += radialDirection * solarPulse * flowStrength * 0.72;
                        animatedPosition.y += risingHeat * flowStrength * 0.9;
                        animatedPosition.x += sin(heatWave * 0.8 + position.z * 5.0) * flowStrength * 0.62;
                        animatedPosition.x += cos(time * 0.8 + phase + position.y * 10.0) * flowStrength * 0.28;
                        animatedPosition.z += cos(heatWave * 0.72 + position.x * 5.0) * flowStrength * 0.58;
                        animatedPosition.z += sin(time * 0.65 + phase * 1.4 + position.y * 7.0) * flowStrength * 0.25;
                        vColor = color;
                        vec4 mvPosition = modelViewMatrix * vec4(animatedPosition, 1.0);
                        gl_PointSize = clamp(pointSize * (300.0 / -mvPosition.z), 0.8, 3.2);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    void main() {
                        float edge = distance(gl_PointCoord, vec2(0.5));
                        float alpha = 1.0 - smoothstep(0.22, 0.5, edge);
                        gl_FragColor = vec4(vColor * 1.08, alpha * 0.35);
                    }
                `,
                vertexColors: true,
                transparent: true,
                blending: THREE.NormalBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geometry, material);
            
            const scale = 0.7;
            particleSystem.scale.set(scale, scale, scale);
            scene.add(particleSystem);
            
            const fitDistance = (largestDimension * scale) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
            camera.position.set(0, 0, fitDistance * 1.3);
            camera.near = Math.max(largestDimension / 100, 0.01);
            camera.far = largestDimension * 20;
            camera.updateProjectionMatrix();
            controls.target.set(0, 0, 0);
            controls.update();
        }, undefined, (error) => {
            console.error('Error loading model:', error);
        });

        function resizeRenderer() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            if (width > 0 && height > 0) {
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            }
        }
        window.addEventListener('resize', resizeRenderer);

        function animate() {
            requestAnimationFrame(animate);
            if (particleSystem) {
                particleSystem.rotation.y += 0.0015;
                particleSystem.material.uniforms.time.value = performance.now() * 0.001;
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        setTimeout(resizeRenderer, 100);

        // =============================================================
        // TYPEWRITER
        // =============================================================
        const typewriterText = document.getElementById('typewriterText');
        const btnWrap = document.getElementById('btnWrap');
        const btnAction = document.getElementById('btnAction');

        const lines = [
            'Anh có vài điều nhỏ bé muốn hỏi em.',
            'Không phải chuyện gì quá lớn lao đâu,',
            'chỉ là đôi điều anh luôn thầm mong được nghe.',
            '',
            'Em có muốn lắng nghe không?'
        ];

        let currentLineIndex = 0;
        let currentCharIndex = 0;
        let isComplete = false;

        function typeNextChar() {
            if (isComplete) return;

            if (currentLineIndex >= lines.length) {
                isComplete = true;
                const allLines = typewriterText.querySelectorAll('.line');
                if (allLines.length > 0) {
                    const lastLine = allLines[allLines.length - 1];
                    if (lastLine) {
                        lastLine.style.color = '#e8867a';
                        lastLine.style.fontWeight = '400';
                    }
                }
                setTimeout(() => {
                    btnWrap.classList.add('show');
                }, 400);
                return;
            }

            const line = lines[currentLineIndex];
            
            if (line === '') {
                const br = document.createElement('br');
                typewriterText.appendChild(br);
                currentLineIndex++;
                setTimeout(typeNextChar, 300);
                return;
            }

            let lineDivs = typewriterText.querySelectorAll('.line');
            if (lineDivs.length <= currentLineIndex) {
                const newDiv = document.createElement('div');
                newDiv.className = 'line';
                typewriterText.appendChild(newDiv);
                lineDivs = typewriterText.querySelectorAll('.line');
            }

            const currentDiv = lineDivs[currentLineIndex];
            if (!currentDiv) {
                currentLineIndex++;
                setTimeout(typeNextChar, 100);
                return;
            }
            
            if (currentCharIndex < line.length) {
                const char = line.charAt(currentCharIndex);
                currentDiv.textContent += char;
                currentCharIndex++;
                const delay = char === ' ' ? 35 : 20;
                setTimeout(typeNextChar, delay);
            } else {
                currentDiv.classList.add('done');
                currentLineIndex++;
                currentCharIndex = 0;
                setTimeout(typeNextChar, 400);
            }
        }

        btnAction.addEventListener('click', () => {
            window.location.href = 'survey.html?hacked=true&timestamp=' + Date.now();
        });

        setTimeout(typeNextChar, 500);

        // =============================================================
        // NỀN SAO
        // =============================================================
        (function createStars() {
            const container2 = document.getElementById('starsBg');
            for (let i = 0; i < 250; i++) {
                const el = document.createElement('div');
                el.className = 'star';
                const size = 0.5 + Math.random() * 2;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.left = Math.random() * 100 + '%';
                el.style.top = Math.random() * 100 + '%';
                el.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
                el.style.setProperty('--opacity-min', (0.1 + Math.random() * 0.3));
                el.style.setProperty('--opacity-max', (0.4 + Math.random() * 0.6));
                el.style.setProperty('--opacity', el.style.getPropertyValue('--opacity-min'));
                container2.appendChild(el);
            }
        })();
    </script>
</body>
</html>
