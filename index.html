<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Bouquet - Douyin Effect</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="bouquet"></canvas>
    <script>
        const canvas = document.getElementById('bouquet');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        // Tông màu hoa hồng phấn và đỏ rực như video
        const colors = ['#ff69b4', '#ffb6c1', '#dc143c', '#fff0f5']; 
        const green = '#228b22'; // Màu cành xanh

        function createParticle(x, y, z, color) {
            return { x, y, z, color, size: Math.random() * 1.5 + 0.5 };
        }

        // Hàm tạo các hạt rải rác trong khối cầu (Tán hoa)
        function addSphere(cx, cy, cz, radius, isFlower, count) {
            for (let i = 0; i < count; i++) {
                const u = Math.random(), v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = Math.cbrt(Math.random()) * radius;

                const x = cx + r * Math.sin(phi) * Math.cos(theta);
                const y = cy + r * Math.sin(phi) * Math.sin(theta);
                const z = cz + r * Math.cos(phi);
                
                let color = isFlower ? colors[Math.floor(Math.random() * colors.length)] : green;
                particles.push(createParticle(x, y, z, color));
            }
        }

        // Hàm tạo hạt cho thân cây
        function addStem(cx, y1, y2, radius, count) {
            for(let i = 0; i < count; i++) {
                const y = y1 + Math.random() * (y2 - y1);
                const r = Math.random() * radius;
                const theta = Math.random() * 2 * Math.PI;
                const x = cx + r * Math.cos(theta);
                const z = r * Math.sin(theta);
                particles.push(createParticle(x, y, z, green));
            }
        }

        // 1. Dựng khung Bó Hoa 3D
        addSphere(0, -50, 0, 70, true, 3000); // Tâm lõi hoa
        addSphere(-50, -30, 35, 55, true, 2000); // Các đóa xung quanh
        addSphere(50, -30, -35, 55, true, 2000);
        addSphere(-40, -40, -45, 55, true, 2000);
        addSphere(40, -40, 45, 55, true, 2000);
        addSphere(0, -90, 0, 60, true, 2000); // Chóp trên
        addSphere(0, -50, 0, 130, true, 1000); // Hào quang bụi phấn
        
        // 2. Dựng cành
        addStem(0, 10, 180, 10, 2000);

        let time = 0;
        function draw() {
            // Tạo vệt mờ lưu ảnh (Motion Blur)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            time += 0.02;
            const angle = time * 0.5; // Tốc độ xoay 3D
            const beat = 1 + 0.03 * Math.sin(time * 3); // Nhịp đập bồng bềnh

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2 + 50);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                
                // Thuật toán xoay 3D trục Y
                let rx = p.x * Math.cos(angle) - p.z * Math.sin(angle);
                let rz = p.x * Math.sin(angle) + p.z * Math.cos(angle);
                let ry = p.y;

                // Thêm hiệu ứng nhiễu loạn và đập
                rx *= beat;
                ry *= beat;
                rx += Math.sin(time * 2 + i) * 1.5;
                ry += Math.cos(time * 2 + i) * 1.5;

                // Chiếu không gian 3D lên mặt phẳng 2D (Perspective Projection)
                const scale = 600 / (600 + rz);
                const px = rx * scale;
                const py = ry * scale;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.min(1, scale * 0.8);
                ctx.fillRect(px, py, p.size * scale, p.size * scale);
            }
            
            ctx.restore();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
