<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Douyin Particle Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #000;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas" width="640" height="640"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        const CANVAS_WIDTH = 640;
        const CANVAS_HEIGHT = 640;
        const CANVAS_CENTER_X = CANVAS_WIDTH / 2;
        const CANVAS_CENTER_Y = CANVAS_HEIGHT / 2;
        const IMAGE_ENLARGE = 11;
        const HEART_COLOR = "#ffb6c1"; // Màu hồng phấn hạt như Python

        function heartFunction(t, shrinkRatio = IMAGE_ENLARGE) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            
            x *= shrinkRatio;
            y *= shrinkRatio;
            x += CANVAS_CENTER_X;
            y += CANVAS_CENTER_Y;
            return [x, y];
        }

        function scatterInside(x, y, beta = 0.15) {
            const ratioX = -beta * Math.log(Math.random());
            const ratioY = -beta * Math.log(Math.random());
            const dx = ratioX * (x - CANVAS_CENTER_X);
            const dy = ratioY * (y - CANVAS_CENTER_Y);
            return [x - dx, y - dy];
        }

        function shrink(x, y, ratio) {
            const force = -1 / Math.pow((Math.pow(x - CANVAS_CENTER_X, 2) + Math.pow(y - CANVAS_CENTER_Y, 2)), 0.6);
            const dx = ratio * force * (x - CANVAS_CENTER_X);
            const dy = ratio * force * (y - CANVAS_CENTER_Y);
            return [x - dx, y - dy];
        }

        function curve(p) {
            return (2 * (2 * Math.sin(4 * p))) / (2 * Math.PI);
        }

        class Heart {
            constructor(generateFrame = 20) {
                this.points = [];
                this.edgeDiffusionPoints = [];
                this.centerDiffusionPoints = [];
                this.allPoints = {};
                this.generateFrame = generateFrame;

                this.build(2000);
                for (let frame = 0; frame < generateFrame; frame++) {
                    this.calc(frame);
                }
            }

            build(number) {
                for (let i = 0; i < number; i++) {
                    const t = Math.random() * 2 * Math.PI;
                    const [x, y] = heartFunction(t);
                    this.points.push([x, y]);
                }

                for (let pt of this.points) {
                    for (let i = 0; i < 3; i++) {
                        const [x, y] = scatterInside(pt[0], pt[1], 0.05);
                        this.edgeDiffusionPoints.push([x, y]);
                    }
                }

                for (let i = 0; i < 4000; i++) {
                    const pt = this.points[Math.floor(Math.random() * this.points.length)];
                    const [x, y] = scatterInside(pt[0], pt[1], 0.17);
                    this.centerDiffusionPoints.push([x, y]);
                }
            }

            calcPosition(x, y, ratio) {
                const force = 1 / Math.pow((Math.pow(x - CANVAS_CENTER_X, 2) + Math.pow(y - CANVAS_CENTER_Y, 2)), 0.520);
                const dx = ratio * force * (x - CANVAS_CENTER_X) + (Math.random() * 2 - 1);
                const dy = ratio * force * (y - CANVAS_CENTER_Y) + (Math.random() * 2 - 1);
                return [x - dx, y - dy];
            }

            calc(generateFrame) {
                const ratio = 10 * curve((generateFrame / 10) * Math.PI);
                const haloRadius = Math.floor(4 + 6 * (1 + curve((generateFrame / 10) * Math.PI)));
                const haloNumber = Math.floor(3000 + 4000 * Math.abs(Math.pow(curve((generateFrame / 10) * Math.PI), 2)));
                const allPoints = [];

                for (let i = 0; i < haloNumber; i++) {
                    const t = Math.random() * 2 * Math.PI;
                    let [x, y] = heartFunction(t, 11.6);
                    [x, y] = shrink(x, y, haloRadius);
                    x += Math.floor(Math.random() * 29 - 14);
                    y += Math.floor(Math.random() * 29 - 14);
                    const size = Math.random() < 0.33 ? 1 : 2;
                    allPoints.push([x, y, size]);
                }

                for (let pt of this.points) {
                    const [x, y] = this.calcPosition(pt[0], pt[1], ratio);
                    const size = Math.floor(Math.random() * 3) + 1;
                    allPoints.push([x, y, size]);
                }

                for (let pt of this.edgeDiffusionPoints) {
                    const [x, y] = this.calcPosition(pt[0], pt[1], ratio);
                    const size = Math.floor(Math.random() * 2) + 1;
                    allPoints.push([x, y, size]);
                }

                for (let pt of this.centerDiffusionPoints) {
                    const [x, y] = this.calcPosition(pt[0], pt[1], ratio);
                    const size = Math.random() < 0.5 ? 1 : 2;
                    allPoints.push([x, y, size]);
                }

                this.allPoints[generateFrame] = allPoints;
            }

            render(renderFrame) {
                ctx.fillStyle = HEART_COLOR;
                const points = this.allPoints[renderFrame % this.generateFrame];
                for (let pt of points) {
                    ctx.fillRect(pt[0], pt[1], pt[2], pt[2]);
                }
            }
        }

        const heart = new Heart();
        let frame = 0;

        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            heart.render(frame);
            frame++;
            setTimeout(() => {
                requestAnimationFrame(draw);
            }, 100);
        }

        draw();
    </script>
</body>
</html>
