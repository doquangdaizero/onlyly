<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💫 Tìm em giữa hàng tỉ người...</title>
    
    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        /* ===== NỀN SAO ===== */
        .stars-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #000;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            opacity: var(--opacity);
        }
        @keyframes twinkle {
            0% { opacity: var(--opacity-min); transform: scale(0.8); }
            100% { opacity: var(--opacity-max); transform: scale(1.2); }
        }

        /* ===== LAYOUT: LEFT (UI) + RIGHT (3D) ===== */
        .app-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 1;
            gap: 0;
        }

        /* ===== LEFT SIDE - UI ===== */
        .left-panel {
            flex: 0 0 42%;
            min-width: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            position: relative;
            z-index: 2;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 28px 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 8px 30px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            opacity: 0;
            transform: translateY(24px) scale(0.97);
            animation: containerIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 0.2s;
            max-height: 95vh;
            overflow-y: auto;
        }
        .container::-webkit-scrollbar {
            width: 3px;
        }
        .container::-webkit-scrollbar-thumb {
            background: rgba(232, 134, 122, 0.15);
            border-radius: 10px;
        }

        @keyframes containerIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== RIGHT SIDE - 3D ===== */
        .right-panel {
            flex: 1;
            position: relative;
            z-index: 1;
            background: transparent;
            min-height: 100vh;
        }
        .right-panel canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== UI COMPONENTS ===== */
        .icon-wrap {
            font-size: 56px;
            margin-bottom: 12px;
            display: inline-block;
            animation: iconFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(232, 134, 122, 0.2));
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-8px) scale(1.05) rotate(-3deg); }
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
            text-shadow: 0 0 40px rgba(232, 134, 122, 0.1);
        }
        .title .hl {
            background: linear-gradient(135deg, #e8867a, #d4738a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
        .sub {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-weight: 300;
            margin-bottom: 28px;
        }
        .sub .hl {
            color: #e8867a;
            font-weight: 400;
        }

        .spinner-wrap {
            display: flex;
            justify-content: center;
            margin: 8px 0 20px;
        }
        .spinner {
            position: relative;
            width: 120px;
            height: 120px;
        }
        .spinner svg {
            width: 120px;
            height: 120px;
            transform: rotate(-90deg);
        }
        .spinner .bg-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 3;
        }
        .spinner .progress-circle {
            fill: none;
            stroke: url(#grad);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 339.292;
            stroke-dashoffset: 339.292;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .spinner .center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .spinner .pct {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            font-family: 'Courier New', monospace;
            transition: all 0.5s ease;
            text-shadow: 0 0 30px rgba(232, 134, 122, 0.1);
        }
        .spinner .pct.done {
            color: #e8867a;
        }
        .spinner .label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 2px;
            transition: all 0.5s ease;
        }
        .spinner .label.done {
            color: #e8867a;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin: 8px 0 16px;
            min-height: 44px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.5s ease;
            flex-shrink: 0;
        }
        .status-dot.active {
            background: #e8867a;
            box-shadow: 0 0 25px rgba(232, 134, 122, 0.3);
            animation: dotPulse 1.2s ease-in-out infinite;
        }
        .status-dot.done {
            background: #d4738a;
            box-shadow: 0 0 30px rgba(212, 115, 138, 0.2);
            animation: none;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .status-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.3px;
            transition: all 0.5s ease;
        }
        .status-text .hl {
            color: #e8867a;
            font-weight: 400;
        }
        .status-text .done {
            color: #d4738a;
            font-weight: 500;
        }

        .log-wrap {
            text-align: left;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            min-height: 70px;
            max-height: 120px;
            overflow-y: auto;
            margin: 4px 0 16px;
        }
        .log-wrap::-webkit-scrollbar {
            width: 3px;
        }
        .log-wrap::-webkit-scrollbar-thumb {
            background: rgba(232, 134, 122, 0.15);
            border-radius: 10px;
        }
        .log {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.15);
            opacity: 0;
            transform: translateX(-6px);
            animation: logIn 0.35s ease forwards;
        }
        .log .icon { font-size: 16px; }
        .log .text { color: rgba(255, 255, 255, 0.4); }
        .log .hl { color: #e8867a; font-weight: 500; }
        .log .ok { color: #d4738a; font-weight: 500; }
        .log .love { color: #e8867a; }

        @keyframes logIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== BUTTON ===== */
        .btn-wrap {
            margin-top: 16px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .btn-wrap.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .btn-love {
            position: relative;
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #e8867a, #d4738a);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(232, 134, 122, 0.3);
            letter-spacing: 0.5px;
            overflow: hidden;
        }
        .btn-love::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50px;
            background: linear-gradient(135deg, #f09a8e, #d4738a);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn-love:hover::before {
            opacity: 1;
        }
        .btn-love:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 40px rgba(232, 134, 122, 0.4);
        }
        .btn-love:active {
            transform: scale(0.96);
        }
        .btn-love .btn-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-love .heart-icon {
            display: inline-block;
            animation: heartBeat 1.2s ease-in-out infinite;
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.2); }
            56% { transform: scale(1); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .app-wrapper {
                flex-direction: column;
            }
            .left-panel {
                flex: 0 0 auto;
                min-width: unset;
                padding: 16px;
                height: auto;
                max-height: 55vh;
                overflow-y: auto;
            }
            .container {
                padding: 24px 18px 20px;
                max-height: 100%;
                background: rgba(0, 0, 0, 0.6);
            }
            .right-panel {
                flex: 1;
                min-height: 45vh;
                height: 45vh;
            }
            .title { font-size: 20px; }
            .icon-wrap { font-size: 44px; }
            .spinner { width: 100px; height: 100px; }
            .spinner svg { width: 100px; height: 100px; }
            .spinner .pct { font-size: 24px; }
            .log { font-size: 12px; }
            .status-text { font-size: 12px; }
            .btn-love { padding: 12px 28px; font-size: 14px; }
        }

        @media (max-width: 480px) {
            .left-panel { padding: 12px; }
            .container { padding: 20px 14px 16px; border-radius: 24px; }
            .title { font-size: 17px; }
            .icon-wrap { font-size: 36px; }
            .spinner { width: 80px; height: 80px; }
            .spinner svg { width: 80px; height: 80px; }
            .spinner .pct { font-size: 20px; }
            .status-bar { padding: 8px 14px; min-height: 36px; }
            .log-wrap { min-height: 50px; max-height: 80px; padding: 8px 12px; }
            .log { font-size: 11px; }
            .btn-love { padding: 10px 20px; font-size: 13px; }
            .btn-love .btn-content { gap: 6px; }
        }
    </style>
</head>
<body>

    <!-- NỀN SAO -->
    <div class="stars-bg" id="starsBg"></div>

    <!-- ===== APP WRAPPER ===== -->
    <div class="app-wrapper">

        <!-- ===== LEFT PANEL ===== -->
        <div class="left-panel">
            <div class="container" id="container">
                <!-- Icon -->
                <div class="icon-wrap" id="iconWrap">💫</div>

                <!-- Title -->
                <div class="title" id="title">
                    Tìm <span class="hl">em</span> giữa hàng tỉ người...
                </div>
                <div class="sub" id="sub">
                    Biết đâu <span class="hl">em</span> ở đâu đó...
                </div>

                <!-- Spinner -->
                <div class="spinner-wrap">
                    <div class="spinner">
                        <svg viewBox="0 0 120 120">
                            <defs>
                                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#e8867a"/>
                                    <stop offset="50%" style="stop-color:#e8867a"/>
                                    <stop offset="100%" style="stop-color:#d4738a"/>
                                </linearGradient>
                            </defs>
                            <circle class="bg-circle" cx="60" cy="60" r="54"/>
                            <circle class="progress-circle" id="progressCircle" cx="60" cy="60" r="54"/>
                        </svg>
                        <div class="center">
                            <div class="pct" id="pct">0%</div>
                            <div class="label" id="label">TÌM EM</div>
                        </div>
                    </div>
                </div>

                <!-- Status -->
                <div class="status-bar">
                    <span class="status-dot active" id="statusDot"></span>
                    <span class="status-text" id="statusText">
                        <span class="hl">●</span> Đang tìm em...
                    </span>
                </div>

                <!-- Log -->
                <div class="log-wrap" id="logWrap">
                    <div class="log">
                        <span class="icon">💫</span>
                        <span class="text">Bắt đầu tìm em...</span>
                    </div>
                </div>

                <!-- ===== BUTTON ===== -->
                <div class="btn-wrap" id="btnWrap">
                    <button class="btn-love" id="btnLove">
                        <span class="btn-content">
                            <span class="heart-icon">❤️</span>
                            Cho anh vào tim em nhé
                            <span class="heart-icon">❤️</span>
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ===== RIGHT PANEL - 3D ROSE ===== -->
        <div class="right-panel" id="threeContainer"></div>
    </div>

    <!-- ============================================================= -->
    <!-- THREE.JS SCRIPT -->
    <!-- ============================================================= -->
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

        // --- Khởi tạo Scene, Camera, Renderer ---
        const container = document.getElementById('threeContainer');
        const scene = new THREE.Scene();
        scene.add(new THREE.HemisphereLight(0xffe8e2, 0x26302a, 1.8));
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
        keyLight.position.set(2, 4, 5);
        scene.add(keyLight);
        
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;

        // --- Tải mô hình và tạo hệ thống hạt siêu mịn ---
        const loader = new GLTFLoader();
        const PARTICLE_COUNT = 600000;
        let particleSystem;
        let detailModel;

        const MODEL_URL = 'flower-bouquet/source/flower_bouquet.glb';

        loader.load(MODEL_URL, (gltf) => {
            const vertices = [];
            const colors = [];
            const phases = [];
            const meshes = [];

            gltf.scene.traverse((child) => {
                if (child.isMesh) meshes.push(child);
            });
            gltf.scene.updateMatrixWorld(true);

            const tempPosition = new THREE.Vector3();
            const innerPosition = new THREE.Vector3();
            const bounds = new THREE.Box3();
            meshes.forEach((mesh) => bounds.union(new THREE.Box3().setFromObject(mesh)));
            const modelCenter = bounds.getCenter(new THREE.Vector3());
            const modelSize = bounds.getSize(new THREE.Vector3());
            const meshWeights = meshes.map((mesh) => {
                const isStem = /stem/i.test(mesh.name);
                const isGreen = /leav|plant|green|foliage/i.test(mesh.name);
                const isRibbon = /ribbon/i.test(mesh.name);
                return isStem ? 0.4 : (isGreen ? 0.28 : (isRibbon ? 0.7 : 2.1));
            });
            const totalWeight = meshWeights.reduce((sum, weight) => sum + weight, 0);

            meshes.forEach((mesh, meshIndex) => {
                const sampler = new MeshSurfaceSampler(mesh).build();
                const isStem = /stem/i.test(mesh.name);
                const isGreen = /leav|plant|green|foliage/i.test(mesh.name);
                const isRibbon = /ribbon/i.test(mesh.name);
                const isPetal = /^petal/i.test(mesh.name);
                const flowerMeshPalette = [0xfffaf5, 0xe9a5ad, 0xffffff, 0xf1b3b5, 0xffe7dd, 0xd9828c];
                const greenPalette = [0xb7c1ad, 0x9cae9d, 0xd0d0bf, 0x829486, 0xc3c8b9];
                const stemPalette = [0x9f5b5d, 0xb87373, 0x7f4b50, 0xc48782];
                const ribbonPalette = [0xffffff, 0xfffaf4, 0xf5eee5, 0xe9e1d8];
                const pointsPerMesh = Math.max(80, Math.floor(PARTICLE_COUNT * meshWeights[meshIndex] / totalWeight));
                const meshBounds = new THREE.Box3().setFromObject(mesh);
                const meshCenter = meshBounds.getCenter(new THREE.Vector3());
                const meshExtent = meshBounds.getSize(new THREE.Vector3());

                for (let i = 0; i < pointsPerMesh; i++) {
                    sampler.sample(tempPosition);
                    tempPosition.applyMatrix4(mesh.matrixWorld);

                    vertices.push(tempPosition.x, tempPosition.y, tempPosition.z);

                    const localX = (tempPosition.x - meshCenter.x) / Math.max(meshExtent.x, 0.001);
                    const localY = (tempPosition.y - meshCenter.y) / Math.max(meshExtent.y, 0.001);
                    const localZ = (tempPosition.z - meshCenter.z) / Math.max(meshExtent.z, 0.001);
                    const petalRadius = Math.sqrt(localX * localX + localY * localY + localZ * localZ);
                    const petalAngle = Math.atan2(localY, localX);
                    const petalLayer = Math.sin(petalRadius * 18.0 + petalAngle * 2.5 + localZ * 5.0);
                    const flowerBase = new THREE.Color(flowerMeshPalette[meshIndex % flowerMeshPalette.length]);
                    const petalWhite = new THREE.Color(0xfffaf5);
                    const flowerHighlight = isPetal && petalLayer > 0.05;
                    const particleColor = flowerHighlight
                        ? petalWhite.lerp(flowerBase, Math.random() * 0.28)
                        : flowerBase.clone().lerp(new THREE.Color(0xffffff), Math.random() * 0.08);
                    const palette = isRibbon ? ribbonPalette : (isStem ? stemPalette : greenPalette);
                    const finalColor = isRibbon || isStem || isGreen
                        ? new THREE.Color(palette[Math.floor(Math.random() * palette.length)])
                        : particleColor;
                    colors.push(finalColor.r, finalColor.g, finalColor.b);
                    phases.push(Math.random() * Math.PI * 2);

                    if (isPetal) {
                        innerPosition.copy(tempPosition).lerp(modelCenter, 0.1);
                        vertices.push(innerPosition.x, innerPosition.y, innerPosition.z);
                        colors.push(finalColor.r, finalColor.g, finalColor.b);
                        phases.push(Math.random() * Math.PI * 2);
                    } else {
                        innerPosition.copy(tempPosition).lerp(modelCenter, 0.16);
                        vertices.push(innerPosition.x, innerPosition.y, innerPosition.z);
                        colors.push(finalColor.r, finalColor.g, finalColor.b);
                        phases.push(Math.random() * Math.PI * 2);
                        innerPosition.copy(tempPosition).lerp(modelCenter, 0.34);
                        vertices.push(innerPosition.x, innerPosition.y, innerPosition.z);
                        colors.push(finalColor.r, finalColor.g, finalColor.b);
                        phases.push(Math.random() * Math.PI * 2);
                    }
                }
            });

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('phase', new THREE.Float32BufferAttribute(phases, 1));
            const largestDimension = Math.max(modelSize.x, modelSize.y, modelSize.z);
            geometry.translate(-modelCenter.x, -modelCenter.y, -modelCenter.z);

            detailModel = gltf.scene;
            detailModel.position.copy(modelCenter).multiplyScalar(-1);
            detailModel.traverse((child) => {
                if (!child.isMesh) return;
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                child.material = materials.map((sourceMaterial) => {
                    const material = sourceMaterial.clone();
                    material.transparent = true;
                    material.opacity = 0.88;
                    material.depthWrite = false;
                    return material;
                });
            });
            scene.add(detailModel);

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    pointSize: { value: Math.max(largestDimension * 0.005, 0.0018) },
                    flowStrength: { value: Math.max(largestDimension * 0.024, 0.001) }
                },
                vertexShader: `
                    uniform float time;
                    uniform float pointSize;
                    uniform float flowStrength;
                    attribute float phase;
                    varying vec3 vColor;
                    void main() {
                        vec3 animatedPosition = position;
                        float heatWave = time * 1.45 + phase + position.y * 8.0;
                        float risingHeat = sin(heatWave) * 0.6 + cos(time * 0.72 + phase * 1.6) * 0.4;
                        vec3 radialDirection = normalize(position + vec3(0.0, 0.12, 0.0));
                        float solarPulse = max(0.0, sin(time * 1.8 + phase * 1.3 + position.y * 6.0));
                        animatedPosition += radialDirection * solarPulse * flowStrength * 0.72;
                        animatedPosition.y += risingHeat * flowStrength * 0.9;
                        animatedPosition.x += sin(heatWave * 0.8 + position.z * 5.0) * flowStrength * 0.62;
                        animatedPosition.x += cos(time * 0.8 + phase + position.y * 10.0) * flowStrength * 0.28;
                        animatedPosition.z += cos(heatWave * 0.72 + position.x * 5.0) * flowStrength * 0.58;
                        animatedPosition.z += sin(time * 0.65 + phase * 1.4 + position.y * 7.0) * flowStrength * 0.25;
                        vColor = color;
                        vec4 mvPosition = modelViewMatrix * vec4(animatedPosition, 1.0);
                        gl_PointSize = clamp(pointSize * (300.0 / -mvPosition.z), 0.9, 3.6);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    void main() {
                        float edge = distance(gl_PointCoord, vec2(0.5));
                        float alpha = 1.0 - smoothstep(0.22, 0.5, edge);
                        gl_FragColor = vec4(vColor * 1.08, alpha * 0.38);
                    }
                `,
                vertexColors: true,
                transparent: true,
                blending: THREE.NormalBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            
            const fitDistance = largestDimension / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
            camera.position.set(0, 0, fitDistance * 1.25);
            camera.near = Math.max(largestDimension / 100, 0.01);
            camera.far = largestDimension * 20;
            camera.updateProjectionMatrix();
            controls.target.set(0, 0, 0);
            controls.update();
        }, undefined, (error) => {
            console.error('Error loading model:', error);
        });

        // --- Resize Handler ---
        function resizeRenderer() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            if (width > 0 && height > 0) {
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            }
        }
        window.addEventListener('resize', resizeRenderer);

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            if (particleSystem) {
                particleSystem.rotation.y += 0.002;
                particleSystem.material.uniforms.time.value = performance.now() * 0.001;
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        setTimeout(resizeRenderer, 100);

        // =============================================================
        // UI SEQUENCE
        // =============================================================
        const CIRCUMFERENCE = 339.292;
        const progressCircle = document.getElementById('progressCircle');
        const pct = document.getElementById('pct');
        const label = document.getElementById('label');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const logWrap = document.getElementById('logWrap');
        const btnWrap = document.getElementById('btnWrap');
        const btnLove = document.getElementById('btnLove');
        const iconWrap = document.getElementById('iconWrap');
        const title = document.getElementById('title');
        const sub = document.getElementById('sub');

        const popupMessages = [
            { icon: '💫', text: 'Đang tìm em giữa hàng tỉ người...', badge: 'TÌM' },
            { icon: '🌙', text: 'Phát hiện một ánh sáng đặc biệt!', badge: 'FOUND' },
            { icon: '☁️', text: 'Em ở đâu nhỉ...?', badge: 'TÌM' },
            { icon: '🌅', text: 'Đang tiến gần hơn...', badge: 'GẦN' },
            { icon: '✨', text: 'Kết nối đang được thiết lập...', badge: 'SYNC' },
            { icon: '🌤', text: 'Hình như là em rồi!', badge: 'GẦN' },
            { icon: '☀️', text: 'Gặp được em thật tuyệt!', badge: 'YES' },
            { icon: '⭐', text: 'Em tỏa sáng quá!', badge: 'WOW' },
            { icon: '🌙', text: 'Cuối cùng cũng tìm thấy...', badge: 'THẤY' },
            { icon: '💫', text: 'Chính là em!', badge: 'ĐÂY RỒI' }
        ];

        function showPopup(msg, delay = 0) {
            const el = document.createElement('div');
            el.className = 'popup';
            el.style.setProperty('--delay', delay + 's');
            el.innerHTML = `
                <span class="icon">${msg.icon}</span>
                <span class="text">${msg.text}</span>
                <span class="badge">${msg.badge}</span>
            `;
            const x = 10 + Math.random() * (window.innerWidth * 0.35);
            const y = 10 + Math.random() * (window.innerHeight * 0.65);
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);

            const duration = 1.8 + Math.random() * 2.2;
            setTimeout(() => {
                el.classList.add('fade');
                el.style.setProperty('--delay', duration + 's');
                setTimeout(() => {
                    if (el.parentNode) el.remove();
                }, duration * 1000 + 400);
            }, duration * 1000);
        }

        function addLog(icon, text, delay = 0) {
            return new Promise(resolve => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'log';
                    div.innerHTML = `<span class="icon">${icon}</span><span class="text">${text}</span>`;
                    logWrap.appendChild(div);
                    logWrap.scrollTop = logWrap.scrollHeight;
                    resolve();
                }, delay);
            });
        }

        function setProgress(pctVal, labelText) {
            const offset = CIRCUMFERENCE - (pctVal / 100) * CIRCUMFERENCE;
            progressCircle.style.strokeDashoffset = offset;
            pct.textContent = Math.round(pctVal) + '%';
            label.textContent = labelText;
        }

        function setStatus(text, type = 'normal') {
            if (type === 'done') {
                statusDot.className = 'status-dot done';
                statusText.innerHTML = `<span class="done">●</span> <span class="done">${text}</span>`;
            } else {
                statusDot.className = 'status-dot active';
                statusText.innerHTML = `<span class="hl">●</span> ${text}`;
            }
        }

        function redirectToSurvey() {
            window.location.href = 'survey.html?hacked=true&timestamp=' + Date.now();
        }

        // Bắt sự kiện click nút
        btnLove.addEventListener('click', () => {
            redirectToSurvey();
        });

        async function startSequence() {
            let popupInterval = setInterval(() => {
                const msg = popupMessages[Math.floor(Math.random() * popupMessages.length)];
                showPopup(msg);
            }, 1200);

            setStatus('Đang tìm em...');
            await addLog('💫', 'Bắt đầu tìm em...', 300);
            
            for (let p = 3; p <= 25; p += 2) {
                setProgress(p, 'TÌM EM');
                await new Promise(r => setTimeout(r, 120));
            }
            await addLog('🌙', 'Biết đâu em ở đâu đó...', 400);
            await addLog('☁️', 'Đang tìm em giữa hàng tỉ người...', 500);

            setStatus('Phát hiện <span class="hl">ánh sáng</span> đặc biệt...');
            for (let p = 28; p <= 52; p += 2) {
                setProgress(p, 'PHÁT HIỆN');
                await new Promise(r => setTimeout(r, 100));
            }
            await addLog('🌅', 'Phát hiện <span class="hl">ánh sáng</span> đặc biệt!', 400);
            await addLog('✨', 'Kết nối đang <span class="hl">thiết lập</span>...', 500);

            setStatus('Đang tiến gần <span class="hl">em</span> hơn...');
            for (let p = 55; p <= 80; p += 2) {
                setProgress(p, 'TIẾN GẦN');
                await new Promise(r => setTimeout(r, 90));
            }
            await addLog('🌤', 'Hình như <span class="love">em</span> ở đây rồi...', 400);
            await addLog('☀️', 'Đang đến gần <span class="love">em</span>...', 500);

            setStatus('Đang đến gần <span class="hl">em</span>...');
            for (let p = 83; p <= 100; p += 1.5) {
                setProgress(p, 'GẦN RỒI');
                await new Promise(r => setTimeout(r, 80));
            }
            await addLog('⭐', '<span class="ok">✓ Tìm thấy em rồi!</span>', 400);
            await addLog('🌙', 'Chính là <span class="love">em</span>!', 500);

            clearInterval(popupInterval);

            iconWrap.textContent = '☀️';
            title.innerHTML = 'Tìm thấy <span class="hl">em</span> rồi!';
            sub.innerHTML = 'Thì ra <span class="hl">em</span> ở đây... 💫';
            pct.classList.add('done');
            label.classList.add('done');
            setStatus('✦ TÌM THẤY EM ✦', 'done');

            setTimeout(() => {
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const msg = popupMessages[Math.floor(Math.random() * popupMessages.length)];
                        showPopup(msg);
                    }, i * 400);
                }
            }, 300);

            // Hiển thị nút sau khi tìm thấy
            setTimeout(() => {
                btnWrap.classList.add('show');
            }, 800);
        }

        setTimeout(startSequence, 600);

        // =============================================================
        // TẠO NỀN SAO
        // =============================================================
        (function createStars() {
            const container2 = document.getElementById('starsBg');
            for (let i = 0; i < 300; i++) {
                const el = document.createElement('div');
                el.className = 'star';
                const size = 0.5 + Math.random() * 2.5;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.left = Math.random() * 100 + '%';
                el.style.top = Math.random() * 100 + '%';
                el.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
                el.style.setProperty('--opacity-min', (0.1 + Math.random() * 0.3));
                el.style.setProperty('--opacity-max', (0.4 + Math.random() * 0.6));
                el.style.setProperty('--opacity', el.style.getPropertyValue('--opacity-min'));
                container2.appendChild(el);
            }
        })();

        console.log('💫 Tìm em giữa hàng tỉ người...');
    </script>
</body>
</html>
