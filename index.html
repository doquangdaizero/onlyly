<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoa Hồng 3D - Douyin</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Nền đen làm nổi bật bông hoa */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="flowerCanvas"></canvas>

    <script>
        var canvas = document.getElementById('flowerCanvas');
        var ctx = canvas.getContext('2d');
        
        // Cài đặt kích thước
        canvas.width = 600;
        canvas.height = 600;
        
        var m = Math;
        var C = m.cos;
        var S = m.sin;
        var P = m.pow;
        var R = m.random;
        var f = 600;
        var h = -250;
        var zBuffer = [];
        
        // Thuật toán vẽ cánh hoa và lá
        function p(a, b, c) {
            if (c > 60) {
                return [
                    S(a * 7) * (13 + 5 / (.2 + P(b * 4, 4))) - S(b) * 50,
                    b * f + 50,
                    625 + C(a * 7) * (13 + 5 / (.2 + P(b * 4, 4))) + b * 400,
                    a * 1 - b / 2,
                    a
                ];
            }
            var A = a * 2 - 1;
            var B = b * 2 - 1;
            if (A * A + B * B < 1) {
                if (c > 37) {
                    var j = c & 1;
                    var n = j ? 6 : 4;
                    var o = .5 / (a + .01) + C(b * 125) * 3 - a * 300;
                    var w = b * h;
                    return [
                        o * C(n) + w * S(n) + j * 610 - 390,
                        o * S(n) - w * C(n) + 550 - j * 350,
                        1180 + C(B + A) * 99 - j * 300,
                        .4 - a * .1 + P(1 - B * B, -h * 6) * .15 - a * b * .4 + C(a + b) / 5 + P(C((o * (a + 1) + (B > 0 ? w : -w)) / 25), 30) * .1 * (1 - B * B),
                        o / 1e3 + .7 - o * w * 3e-6
                    ];
                }
                if (c > 32) {
                    c = c * 1.16 - .15;
                    var o = a * 45 - 20;
                    var w = b * b * h;
                    var z = o * S(c) + w * C(c) + 620;
                    return [
                        o * C(c) - w * S(c),
                        28 + C(B * .5) * 99 - b * b * b * 60 - z / 2 - h,
                        z,
                        (b * b * .3 + P((1 - (A * A)), 7) * .15 + .3) * b,
                        b * .7
                    ];
                }
                var o = A * (2 - b) * (80 - c * 2);
                var w = 99 - C(A) * 120 - C(b) * (-h - c * 4.9) + C(P(1 - b, 7)) * 50 + c * 2;
                var z = o * S(c) + w * C(c) + 700;
                return [
                    o * C(c) - w * S(c),
                    B * 99 - C(P(b, 7)) * 50 - c / 3 - z / 1.35 + 450,
                    z,
                    (1 - b / 1.2) * .9 + a * .1,
                    P((1 - b), 20) / 4 + .05
                ];
            }
        }

        // Vòng lặp Render hoa
        setInterval(function () {
            for (var i = 0; i < 10000; i++) {
                var a = R(), b = R(), c = i % 46 / .74;
                var s = p(a, b, c);
                if (s) {
                    var z = s[2];
                    var x = ~~(s[0] * f / z - h);
                    var y = ~~(s[1] * f / z - h);
                    var q = y * f + x;
                    
                    // Tính toán màu sắc và chiều sâu (Z-index)
                    if (typeof zBuffer[q] === 'undefined' || zBuffer[q] > z) {
                        zBuffer[q] = z;
                        var r = ~(s[3] * h);
                        var g = ~(s[4] * h);
                        var blue = ~(s[3] * s[3] * -80);
                        
                        ctx.fillStyle = "rgb(" + r + "," + g + "," + blue + ")";
                        ctx.fillRect(x, y, 1, 1); // Vẽ từng điểm ảnh
                    }
                }
            }
        }, 0);
    </script>
</body>
</html>
